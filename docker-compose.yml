services:
  postgres-evolution:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVOLUTION_DB_USER:?set EVOLUTION_DB_USER}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?set EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_evolution_data:/var/lib/postgresql/data
      - ./deploy/evolution-init.sql:/docker-entrypoint-initdb.d/01-evolution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1.3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-whatsapp}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-go:
    image: evoapicloud/evolution-go:0.7.2
    restart: unless-stopped
    expose:
      - "4000"
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.evolution-go.rule=Host(`evolution-go.example.com`)
      - traefik.http.routers.evolution-go.entrypoints=web-secure
      - traefik.http.routers.evolution-go.tls.certresolver=letsencrypt
      - traefik.http.services.evolution-go.loadbalancer.server.port=4000
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY}
      POSTGRES_AUTH_DB: postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@postgres-evolution:5432/${EVOLUTION_AUTH_DB_NAME:-evogo_auth}?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@postgres-evolution:5432/${EVOLUTION_USERS_DB_NAME:-evogo_users}?sslmode=disable
      DATABASE_SAVE_MESSAGES: "true"
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-whatsapp}
      AMQP_GLOBAL_ENABLED: "true"
      AMQP_GLOBAL_EVENTS: "MESSAGE,SEND_MESSAGE,HISTORY_SYNC,CONNECTION"
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-evolution-media}
      MINIO_USE_SSL: "false"
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    depends_on:
      postgres-evolution: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/swagger/index.html >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  postgres-mcp:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MCP_DB_USER:?set MCP_DB_USER}
      POSTGRES_PASSWORD: ${MCP_DB_PASSWORD:?set MCP_DB_PASSWORD}
      POSTGRES_DB: ${MCP_DB_NAME:-whatsapp_mcp}
    volumes:
      - postgres_mcp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  whatsapp-mcp:
    build: .
    restart: unless-stopped
    stdin_open: true
    environment:
      LISTEN_ADDR: :8080
      EVOLUTION_URL: http://evolution-go:4000
      EVOLUTION_PUBLIC_URL: https://evolution-go.example.com
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_TIMEOUT: ${EVOLUTION_TIMEOUT:-5s}
      STATUS_POLL_INTERVAL: ${STATUS_POLL_INTERVAL:-15s}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-whatsapp}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-message}
      DATABASE_URL: postgres://${MCP_DB_USER}:${MCP_DB_PASSWORD}@postgres-mcp:5432/${MCP_DB_NAME:-whatsapp_mcp}?sslmode=disable
      FRESHNESS_WINDOW: ${FRESHNESS_WINDOW:-5m}
    expose:
      - "8080"
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.whatsapp-mcp.rule=Host(`whatsapp-mcp.example.com`)
      - traefik.http.routers.whatsapp-mcp.entrypoints=web-secure
      - traefik.http.routers.whatsapp-mcp.tls.certresolver=letsencrypt
      - traefik.http.services.whatsapp-mcp.loadbalancer.server.port=8080
    depends_on:
      postgres-mcp: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      evolution-go: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  evolution_data:
  evolution_logs:
  postgres_evolution_data:
  rabbitmq_data:
  minio_data:
  postgres_mcp_data:

networks:
  dokploy-network:
    external: true
