# Self-contained stack: Evolution Go, its PostgreSQL, RabbitMQ, MinIO, the
# gateway's own PostgreSQL, and the gateway. Host-agnostic on purpose: it
# publishes the panel on loopback and knows nothing about a reverse proxy.
#
# The project name is pinned so the named volumes keep their identity no matter
# which directory or overlay file Compose is invoked from.
name: whatsapp-mcp

services:
  postgres-evolution:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVOLUTION_DB_USER:?set EVOLUTION_DB_USER}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?set EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_evolution_data:/var/lib/postgresql/data
      - ./deploy/evolution-init.sql:/docker-entrypoint-initdb.d/01-evolution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1.3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-whatsapp}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # quay.io, not Docker Hub: MinIO took minio/minio down from Hub, so the
    # Hub reference stopped resolving and the installer died pulling it.
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Evolution has no public surface: it stays on the project's internal network,
  # reachable only by whatsapp-mcp. The control panel drives it from the inside,
  # so neither its API nor its manager needs to be exposed.
  evolution-go:
    image: evoapicloud/evolution-go:0.7.2
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY}
      # Evolution Go needs a licence and answers 503 on every route until it
      # has one. With the operator's email set it activates itself on startup —
      # Evolution's own headless flow, which calls their licensing server and
      # skips the browser. It works for an email that has registered once
      # before, and falls back to the manual flow otherwise, so the very first
      # registration an operator ever does is still a browser visit.
      #
      # This is what makes a rebuild or a new server come up already activated
      # instead of waiting for someone to click through a form again.
      EVOLUTION_OPERATOR_EMAIL: ${EVOLUTION_OPERATOR_EMAIL:-}
      POSTGRES_AUTH_DB: postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@postgres-evolution:5432/${EVOLUTION_AUTH_DB_NAME:-evogo_auth}?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@postgres-evolution:5432/${EVOLUTION_USERS_DB_NAME:-evogo_users}?sslmode=disable
      # Evolution keeps its own copy of every message when this is on, which
      # duplicates the gateway's index in a database the gateway never reads.
      # Off by default: the index in postgres-mcp is the only history, and the
      # raw protobuf stored alongside it is what /message/downloadmedia needs.
      # Turn it back on if delivery status or poll results prove to depend on
      # Evolution's own store.
      DATABASE_SAVE_MESSAGES: "${EVOLUTION_SAVE_MESSAGES:-false}"
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-whatsapp}
      AMQP_GLOBAL_ENABLED: "true"
      AMQP_GLOBAL_EVENTS: "MESSAGE,SEND_MESSAGE,HISTORY_SYNC,CONNECTION"
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-evolution-media}
      MINIO_USE_SSL: "false"
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    depends_on:
      postgres-evolution: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/swagger/index.html >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  postgres-mcp:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MCP_DB_USER:?set MCP_DB_USER}
      POSTGRES_PASSWORD: ${MCP_DB_PASSWORD:?set MCP_DB_PASSWORD}
      POSTGRES_DB: ${MCP_DB_NAME:-whatsapp_mcp}
    volumes:
      - postgres_mcp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  whatsapp-mcp:
    # The published image, so nobody compiles Go on their own server: a deploy
    # is a pull, and 1 GB of RAM is enough. WHATSAPP_MCP_TAG pins a version —
    # `edge` follows main, `v1.2.3` holds still.
    #
    # `build` is kept alongside it for working on the code: plain
    # `docker compose up -d` pulls, and `--build` compiles this checkout
    # instead.
    image: ghcr.io/brorlandi/whatsapp-mcp:${WHATSAPP_MCP_TAG:-edge}
    build: .
    restart: unless-stopped
    stdin_open: true
    environment:
      LISTEN_ADDR: :8080
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      EVOLUTION_URL: http://evolution-go:4000
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_TIMEOUT: ${EVOLUTION_TIMEOUT:-5s}
      STATUS_POLL_INTERVAL: ${STATUS_POLL_INTERVAL:-15s}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-whatsapp}
      DATABASE_URL: postgres://${MCP_DB_USER}:${MCP_DB_PASSWORD}@postgres-mcp:5432/${MCP_DB_NAME:-whatsapp_mcp}?sslmode=disable
      FRESHNESS_WINDOW: ${FRESHNESS_WINDOW:-5m}
      # Guards the first-run form. The installer generates one because it
      # publishes a URL to the internet, where whoever reaches /setup first
      # would otherwise become the administrator. Empty leaves the form open,
      # which is right for a panel bound to loopback.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    # Bound to loopback by default: the panel has no business facing the
    # internet directly. Put a TLS-terminating reverse proxy in front of it and
    # point PUBLIC_URL at the hostname it answers on. PANEL_BIND=0.0.0.0 opens
    # it to the network, which only makes sense on a host nobody else reaches.
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8080}:8080"
    depends_on:
      postgres-mcp: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      evolution-go: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  evolution_data:
  evolution_logs:
  postgres_evolution_data:
  rabbitmq_data:
  minio_data:
  postgres_mcp_data:
