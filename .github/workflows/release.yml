# Publishes what people actually install: a multi-arch container image, and the
# Linux binaries for anyone running the gateway without Compose.
#
# The point is that nobody compiles this on their own server. The installer
# pulls the image, so a 1 GB VM is enough and a deploy takes seconds instead of
# minutes.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      # The tags and the full history are what `git describe` needs. The
      # default shallow checkout has neither, and the version would silently
      # fall back to a bare sha on every build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # What the binary reports about itself: "0.1.0-beta" exactly on a release
      # tag, "0.1.0-beta-12-gabc1234" on a main build past it.
      - id: version
        run: echo "describe=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `edge` follows main, a version tag gets its own tags plus `latest`.
      # Everything also gets the commit sha, so a deploy can be pinned exactly.
      # Both `0.1.0` and `v0.1.0` are published: the bare form is the registry
      # convention, the prefixed one is what people copy from the git tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          # `latest` is what someone gets when they pin nothing, so a
          # prerelease must not move it — publishing v0.1.0-beta would
          # otherwise make the beta the default for everybody. A tag with a
          # hyphen in it is a prerelease by the semver definition, which is
          # every tag in the 0.1.0-beta series. ({{major}}.{{minor}} is skipped
          # for prereleases by metadata-action itself, for the same reason.)
          flavor: latest=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.describe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    # Only on a tag: a loose binary needs a version people can name.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -trimpath \
              -ldflags="-s -w -X github.com/BrOrlandi/whatsapp-mcp/internal/version.Version=$(git describe --tags --always)" \
              -o "dist/whatsapp-mcp_linux_${arch}/whatsapp-mcp" ./cmd/whatsapp-mcp
            tar -czf "dist/whatsapp-mcp_${GITHUB_REF_NAME}_linux_${arch}.tar.gz" \
              -C "dist/whatsapp-mcp_linux_${arch}" whatsapp-mcp
          done
          cd dist && sha256sum *.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
