# Builds the Evolution Go image the stack runs: the official 0.7.2 with the
# patches in deploy/evolution/patches applied, until Evolution publishes a
# release that fixes the reconnect loop (issue #6). deploy/evolution/README.md
# explains what the patches change and when to drop this.
#
# Published as a tag of this repository's package, `evolution-<version>`, so it
# is public like the gateway image and nobody mistakes it for an official
# Evolution build.
name: evolution

on:
  push:
    branches: [main]
    paths:
      - deploy/evolution/**
      - .github/workflows/evolution.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Raise the patch number whenever deploy/evolution/patches changes.
  TAG: evolution-0.7.2-patch.1

jobs:
  # One native runner per architecture: Evolution needs CGO (libwebp, libjpeg),
  # and compiling that under QEMU takes the better part of an hour.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the source
        run: deploy/evolution/prepare.sh "$RUNNER_TEMP/evolution-go"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/evolution-go
          platforms: ${{ matrix.platform }}
          # The version Evolution reports about itself stays the one it is
          # built from; the image tag and the labels say it is patched.
          build-args: |
            VERSION=0.7.2
          labels: |
            org.opencontainers.image.title=Evolution Go 0.7.2, patched for WhatsApp MCP
            org.opencontainers.image.description=Unofficial build of Evolution Go 0.7.2 with evolution-foundation/evolution-go#190 applied. Not endorsed by Evolution Foundation.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=0.7.2
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=evolution-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=evolution-${{ matrix.runner }}

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
