# Temporary compatibility routes for Dokploy's generated `websecure` labels.
# Install on the Dokploy host under /etc/dokploy/traefik/dynamic/.
# The file provider watches this directory and reloads it automatically.
http:
  routers:
    whatsapp-mcp-public:
      rule: "Host(`whatsapp-mcp.example.com`)"
      entryPoints:
        - web-secure
      service: whatsapp-mcp-public
      tls:
        certResolver: letsencrypt
  services:
    whatsapp-mcp-public:
      loadBalancer:
        servers:
          - url: "http://whatsapp-mcp:8080"
